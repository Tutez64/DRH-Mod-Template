# On a tag vX.Y.Z equal to mod.json's version: drafts a release with the
# mod's zip and index entry. The steps live in DRH-Mod-Workflows.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    uses: Tutez64/DRH-Mod-Workflows/.github/workflows/release.yml@v1
